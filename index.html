<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#245f55" />
    <meta name="description" content="Rillmark. Expressive interfaces, considered defaults. An editable-source React design system for people and their agents." />
    <title>Rillmark — Interfaces with a point of view</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>try{const root=document.documentElement;const preset=localStorage.getItem('rillmark-preset');const mode=localStorage.getItem('rillmark-theme');root.dataset.rillmarkPreset=['fieldnotes','studio','play'].includes(preset)?preset:'fieldnotes';root.dataset.rillmarkMode=['light','dark','system'].includes(mode)?mode:'system';root.classList.toggle('dark',root.dataset.rillmarkMode==='dark'||(root.dataset.rillmarkMode==='system'&&matchMedia('(prefers-color-scheme: dark)').matches))}catch{document.documentElement.dataset.rillmarkMode='system'}</script>
  </head>
  <body><div id="root"></div><script type="module" src="/src/main.tsx"></script></body>
</html>
