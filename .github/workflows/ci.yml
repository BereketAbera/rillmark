name: Release checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Check generated source and documentation stay in sync
        run: git diff --exit-code -- registry.json public src/generated
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=low
      - run: npm run test:consumer
      - run: npm run test:mcp
      - run: npx playwright install --with-deps chromium
      - name: Headed browser interaction and accessibility checks
        run: xvfb-run --auto-servernum npm run test:e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: browser-verification
          path: |
            playwright-report/
            test-results/
            docs/evidence/
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: static-site-and-registry
          path: dist/
          retention-days: 7
