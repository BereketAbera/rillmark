# rillmark.bereket.dev, behind Traefik. Traefik terminates TLS; this server only answers the cluster on 8080.
#
# The site routes with the URL hash (#/components/button), so every deep link loads index.html from / and there is no
# history-mode fallback: a path with no file is a real 404, which keeps a mistyped /llms.txt or /docs/*.md honest. A
# directory is such a path too, with or without its trailing slash: only / has an index.

# Under /assets/ only a file Vite wrote may be kept for a year, never an error. A chunk that answered 404 during a deploy,
# kept as immutable, would stay broken in that browser after a rollback brought it back.
map $status $assets_cache_control {
    200     "public, max-age=31536000, immutable";
    206     "public, max-age=31536000, immutable";
    304     "public, max-age=31536000, immutable";
    default "no-cache";
}

server {
    listen 8080;
    server_name _;
    # dist/ and nothing else. The Dockerfile says why this is not the base image's /usr/share/nginx/html.
    root /srv/www;

    server_tokens off;
    absolute_redirect off;
    port_in_redirect off;

    # The agent-facing files are text and must display in a browser rather than download. nginx's mime.types has neither.
    include /etc/nginx/mime.types;
    types {
        text/markdown md;
        text/plain    tsx;
    }
    charset utf-8;
    charset_types text/markdown text/plain text/css application/javascript application/json image/svg+xml;

    # The Dockerfile writes a .gz at level 9 beside each text file of at least 1024 bytes, and gzip_static sends that file to
    # a client that accepts gzip, with no compression per request. A text file without one is still compressed on the fly.
    gzip_static on;
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/markdown text/plain text/css application/javascript application/json image/svg+xml;

    # Probes from the kubelet: no log line every few seconds. Traefik answers this path publicly too, so it carries the
    # same headers as the site, and no cache may keep it.
    location = /healthz {
        access_log off;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-store" always;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Vite writes only content-hashed files here, so a cached copy can never be stale.
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control $assets_cache_control always;
        try_files $uri =404;
    }

    # The one directory with an index. Naming the file here leaves no request to nginx's directory handling, which would
    # redirect /docs to /docs/ and then answer 403, logged as an [error], because /docs/ has no index.html.
    location = / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files /index.html =404;
    }

    # index.html, llms.txt, api.json, docs/**/*.md, source/*.tsx and exploration.html keep stable names, so they revalidate.
    # $uri alone matches files only, so /docs and /docs/ are 404s like any other path with no file.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }
}
