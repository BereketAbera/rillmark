# Included in every location, because an add_header in a location replaces all of the server's.
# index.html bootstraps the theme with an inline script, so a strict script-src would need its hash; this policy leaves
# scripts alone and limits what a page can embed or be embedded by.
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
add_header Content-Security-Policy "frame-ancestors 'self'; base-uri 'self'; object-src 'none'; form-action 'self'" always;
